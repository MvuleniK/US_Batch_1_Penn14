<dialog class="sheet" id="call-sheet" aria-labelledby="call-sheet-title">
  <div class="sheet__in">
    <h2 id="call-sheet-title">Call the office</h2>
    <p>Two lines, one practice at {{ADDR}}. For a medical emergency, call 911.</p>
    <a class="btn btn--secondary btn--block" href="{{TEL_ORTHO}}" data-track="call_ortho_click">Call Orthodontics {{ORTHO}}</a>
    <a class="btn btn--secondary btn--block" href="{{TEL_PEDO}}" data-track="call_pedo_click">Call Pediatric Dentistry {{PEDO}}</a>
    <button class="btn btn--secondary btn--block" type="button" data-close-call>Close</button>
  </div>
</dialog>
