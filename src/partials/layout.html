<!doctype html>
<!-- type: service (a dental clinic: people are hired). site-kind other: photographs, type and flat colour.
     deal: hero split (dealt), nav nav-mega, close close-type, footer footer-visit, rhythm surface-pairs,
     buttons solid, mark arc, palette: the practice's own (start.mjs brand) with the dealt pairing red-hat.
     The practice's colours are the logo's navy-teal ink and leaf green; the dealt clinic palettes (teal on paper,
     frost and slate) are cool and clinical too. moments: pinned-chapters (steps), word-highlight (statement). -->
<html lang="en" data-type="service" data-radius="soft" data-buttons="solid" data-motion data-review="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3f7f6">
<meta name="robots" content="noindex, nofollow"><!-- proof of concept: not for indexing -->
<!-- <link rel="canonical" href="https://[the practice's domain]/"> until the domain is known -->
<meta name="site-kind" content="other">
<meta name="page-type" content="service">
<script>try{var q=new URLSearchParams(location.search).get("review");if(q==="on"||q==="off")localStorage.setItem("toth-review",q);document.documentElement.setAttribute("data-review",localStorage.getItem("toth-review")==="on"?"on":"off")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/system.css">
<link rel="stylesheet" href="assets/ui/cards.css">
<link rel="stylesheet" href="assets/motion/motion.css">
<link rel="stylesheet" href="assets/layout/layout.css">
<link rel="stylesheet" href="assets/hallmark.css">
<link rel="stylesheet" href="assets/page.css">
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
<script>document.documentElement.classList.add('mo-js');setTimeout(()=>document.documentElement.classList.add('mo-safe'),2500)</script>
<link rel="modulepreload" href="assets/moments/moments.js">
<link rel="modulepreload" href="assets/moments/lib.js">
{{moment_links}}
{{jsonld}}
</head>
<body class="{{body_class}}">
{{include:nav}}
<main id="top">
{{content}}
</main>
{{include:footer}}
{{include:actionbar}}
{{include:call-sheet}}
<script type="module" src="assets/system.js"></script>
<script type="module" src="assets/motion/motion.js"></script>
<script type="module" src="assets/layout/layout.js"></script>
<script src="assets/page.js" defer></script>
</body>
</html>
